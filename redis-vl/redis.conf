# Disable Redis persistence for now (https://idnowgmbh.atlassian.net/browse/IDCPTF-1676)
save ""

# Redis Cluster Configuration
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-announce-hostname localhost

# I/O Threading (Redis 8.x feature)
io-threads 4
io-threads-do-reads yes

# Persistence
appendonly yes
appendfsync everysec

# Performance
tcp-keepalive 60
tcp-backlog 511

# Logging
loglevel notice

# Keyspace notifications
notify-keyspace-events "Ex"

